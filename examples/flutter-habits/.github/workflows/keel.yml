# Generated by keel init. Runs the tests, then Keel checks criteria coverage, drift and new
# dependencies, and posts a summary on the pull request (VG-4). Adjust the test step freely.
name: keel
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Tests
        id: tests
        continue-on-error: true
        run: mkdir -p .keel/tmp && flutter test --machine > .keel/tmp/test-results.jsonl
      - uses: adworzynski/test-project/verify@main
        with:
          results: .keel/tmp/test-results.jsonl
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
